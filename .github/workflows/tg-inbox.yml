name: Telegram bot inbox

# Collects "rich" channel posts (inline photos, headings, tables…) that the public
# t.me preview can't show. The bot must be an admin of @investsyoma; its token lives in
# the TG_INBOX_BOT_TOKEN secret. Telegram keeps undelivered updates ~24h, so poll often.
# Captured posts land in scripts/inbox/ and are published by the daily deploy run.
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tg-inbox
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch rich posts from the bot
        env:
          TG_INBOX_BOT_TOKEN: ${{ secrets.TG_INBOX_BOT_TOKEN }}
        run: node scripts/tg-inbox.mjs fetch

      - name: Commit captured posts
        run: |
          if [ -n "$(git status --porcelain scripts/inbox public/images/tg)" ]; then
            git config user.name "invest-sema-bot"
            git config user.email "actions@users.noreply.github.com"
            git add scripts/inbox public/images/tg
            git commit -m "Telegram inbox: capture rich post(s) ($(date -u +%F))"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          else
            echo "Nothing new."
          fi

      # Only after the push succeeded — otherwise Telegram redelivers next run.
      - name: Confirm updates with Telegram
        env:
          TG_INBOX_BOT_TOKEN: ${{ secrets.TG_INBOX_BOT_TOKEN }}
        run: node scripts/tg-inbox.mjs ack
